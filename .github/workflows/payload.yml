name: payload
# Сборка payload-1 (DEC-003, TASK-003, R-01/R-05): staged npm-install DSH@pin +
# stripped zen-adapter + payload.json + sha256 → релиз payload-1.
# OPEN-002: double-retry smoke — ливень 429/5xx гасится в адаптере, DSH-повторы не умножаются.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  DSH_PIN: 0.1.7-alpha.1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (payload must not contain live keys)
        run: |
          ! grep -rInE 'sk-[A-Za-z0-9]{20,}' payload/zen-adapter.mjs || \
            (echo 'LIVE KEY IN PAYLOAD ADAPTER'; exit 1)
          grep -q 'FALLBACK_KEY = ""' payload/zen-adapter.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Staged install DSH
        run: |
          mkdir -p /tmp/stage
          cd /tmp/stage
          npm init -y > /dev/null 2>&1
          npm i --no-audit --no-fund "@deepseek-ai/dsh@${DSH_PIN}"
          node node_modules/@deepseek-ai/dsh/lib/bin.js --version
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js
      - name: Compose payload
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/payload/bin /tmp/payload/node_modules
          cp payload/zen-adapter.mjs /tmp/payload/bin/zen-adapter.mjs
          cp -r /tmp/stage/node_modules/@deepseek-ai /tmp/payload/node_modules/
          # slim: чистим доки/тесты/сорсмапы из payload (размер!)
          find /tmp/payload/node_modules -name "*.md" -delete
          find /tmp/payload/node_modules -path "*__tests__*" -prune -exec rm -rf {} + 2>/dev/null || true
          ADAPTER_SHA=$(sha256sum payload/zen-adapter.mjs | cut -d' ' -f1)
          cat > /tmp/payload/payload.json <<EOF
          {
            "payloadVersion": 1,
            "dshVersion": "${DSH_PIN}",
            "profile": "web",
            "minApkVersion": "1.0.0",
            "zenAdapterSha256": "${ADAPTER_SHA}"
          }
          EOF
          cat /tmp/payload/payload.json
      - name: Smoke — dump-config (boot-free, FACT-DSH-12)
        run: |
          cd /tmp/payload
          node node_modules/@deepseek-ai/dsh/lib/bin.js --profile web --dump-config 2>&1 | head -n 20
      - name: Pack
        run: |
          cd /tmp/payload
          tar -cJf /tmp/payload-1.tar.xz .
          sha256sum /tmp/payload-1.tar.xz | cut -d' ' -f1 | tee /tmp/payload-1.sha256
          ls -lh /tmp/payload-1.tar.xz
          cp /tmp/payload/payload.json /tmp/payload.json
      - name: Publish release payload-1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp
          if gh release view payload-1 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload payload-1 /tmp/payload-1.tar.xz /tmp/payload-1.sha256 /tmp/payload.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create payload-1 /tmp/payload-1.tar.xz /tmp/payload-1.sha256 /tmp/payload.json \
              --repo "$GITHUB_REPOSITORY" --title "DSH payload-1 (0.1.7-alpha.1)"
          fi
